name: HeiBan Windows packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check architecture, generated assets and document behavior
        shell: pwsh
        run: ./windows/scripts/Verify-Development.ps1 -OutputDirectory windows/.build/ci-verification
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            windows/.build/ci-verification/*.json
            windows/.build/ci-verification/*.log
            windows/.build/ci-verification/optimization/results.json
          retention-days: 14
          if-no-files-found: error
  windows:
    needs: verify
    if: github.event_name != 'push'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y
      - name: Build portable package
        shell: pwsh
        run: ./windows/HeiBan.Windows/Packaging/Package-Portable.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Build installer
        shell: pwsh
        run: ./windows/HeiBan.Windows/Packaging/Package-Installer.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Keep Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heiban-windows-${{ matrix.runtime }}
          path: windows/dist/*
          if-no-files-found: error
